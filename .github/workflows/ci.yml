name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  math-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/math-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Shared typecheck
        run: pnpm --filter @axiom/shared typecheck
      - name: Web typecheck
        run: pnpm --filter @axiom/web typecheck
      - name: Web production build
        run: pnpm --filter @axiom/web build
